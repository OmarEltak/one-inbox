<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>OT1-Pro ad renderer</title>
<style>
@font-face{font-family:Cairo;font-weight:500;src:url(fonts/cairo-arabic-500-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:600;src:url(fonts/cairo-arabic-600-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-arabic-800-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-arabic-900-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:500;src:url(fonts/cairo-latin-500-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Cairo;font-weight:600;src:url(fonts/cairo-latin-600-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-latin-700-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-latin-800-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-latin-900-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Serif;font-weight:400;src:url(fonts/instrument-serif-latin-400-normal.woff2)format('woff2')}
@font-face{font-family:Messiri;font-weight:700;src:url(fonts/el-messiri-arabic-700-normal.woff2)format('woff2')}

:root{
  --bg:#0a1814;--bg2:#0f231e;--card:#132a24;--card2:#183530;--line:#24443c;
  --mint:#34d399;--em:#10b981;--em-deep:#0b7a57;--cream:#f6f3ec;--ink:#0a1814;
  --muted:#9db5ae;--soft:#cfdcd8;--red:#fb7185;--amber:#fbbf24;--blue:#60a5fa;--wa:#25d366;
  --ig:#e1306c;--fb:#1877f2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Cairo,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(900px 700px at 80% 18%,rgba(16,185,129,.16),transparent 60%),
    radial-gradient(800px 800px at 10% 85%,rgba(16,185,129,.10),transparent 60%),
    var(--bg)}
#grid{position:absolute;inset:0;opacity:.07;
  background-image:linear-gradient(var(--mint) 1px,transparent 1px),linear-gradient(90deg,var(--mint) 1px,transparent 1px);
  background-size:72px 72px}
.scene{position:absolute;left:0;right:0;top:290px;height:790px;display:flex;align-items:center;justify-content:center;opacity:0}
.brandmark{position:absolute;top:150px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;
  font-family:Serif;font-size:58px;letter-spacing:.5px;color:var(--cream)}
.brandmark .dot{width:14px;height:14px;border-radius:50%;background:var(--mint);box-shadow:0 0 18px var(--mint)}
.brandmark small{font-family:Cairo;font-weight:700;font-size:24px;color:var(--mint);border:2px solid var(--line);border-radius:999px;padding:2px 18px}

/* captions */
#cap{position:absolute;left:60px;right:60px;top:1100px;height:150px;display:flex;align-items:center;justify-content:center}
#cap span{display:inline-block;font-weight:800;font-size:54px;line-height:1.35;text-align:center;
  background:rgba(4,12,10,.82);border:2px solid rgba(52,211,153,.35);border-radius:22px;padding:10px 30px;color:#fff;
  box-shadow:0 12px 40px rgba(0,0,0,.35)}
#cap b{color:var(--mint)}

#foot{position:absolute;top:1330px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;opacity:.45}
#foot span{width:16px;height:16px;border-radius:50%}
#foot b{font-family:Serif;font-weight:400;font-size:40px;margin-inline-start:10px;direction:ltr}
/* generic */
.col{display:flex;flex-direction:column;align-items:center;gap:22px}
.row{display:flex;align-items:center;gap:18px}
.h1{font-weight:900;font-size:84px;line-height:1.15;text-align:center}
.h2{font-weight:800;font-size:60px;line-height:1.2;text-align:center}
.h3{font-weight:700;font-size:40px;line-height:1.3;text-align:center;color:var(--soft)}
.serif{font-family:Serif;font-weight:400}
.soft{color:var(--soft)} .mint{color:var(--mint)} .red{color:var(--red)} .amber{color:var(--amber)} .muted{color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:28px 32px}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:10px 26px;font-weight:800;font-size:34px;border:2px solid var(--line);background:var(--card)}
.tag{font-weight:800;font-size:24px;letter-spacing:.5px;border-radius:999px;padding:4px 16px}
.ltr{direction:ltr;unicode-bidi:isolate}

/* phone */
.phone{width:560px;height:770px;border-radius:64px;background:#060f0d;border:10px solid #1d3a33;position:relative;overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 2px #2c5248 inset}
.phone .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:150px;height:34px;border-radius:20px;background:#000;z-index:5}
.phone .bar{height:120px;background:#0f231e;border-bottom:2px solid var(--line);display:flex;align-items:flex-end;padding:0 26px 16px;gap:16px}
.phone .avatar{width:60px;height:60px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:var(--mint)}
.phone .who{font-weight:800;font-size:28px;line-height:1.1}
.phone .who small{display:block;font-weight:600;font-size:20px;color:var(--muted)}
.phone .msgs{position:absolute;top:120px;bottom:0;left:0;right:0;padding:22px 20px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end}
.b{max-width:82%;font-weight:600;font-size:27px;line-height:1.45;padding:14px 20px;border-radius:24px;opacity:0}
.b.in{align-self:flex-start;background:#1c3832;border-start-start-radius:6px}
.b.out{align-self:flex-end;background:var(--em-deep);border-start-end-radius:6px}
.b .meta{display:block;font-size:17px;font-weight:700;color:rgba(255,255,255,.55);margin-top:4px}
.b.ai .meta{color:#a7f3d0}
.example{position:absolute;top:130px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;color:var(--muted);background:#0a1814;border:1px solid var(--line);border-radius:999px;padding:2px 14px;z-index:4}

/* lock screen */
.lock{width:560px;height:770px;border-radius:64px;border:10px solid #1d3a33;background:linear-gradient(#071311,#0c201b);position:relative;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.55)}
.lock .time{position:absolute;top:110px;left:0;right:0;text-align:center;font-family:Serif;font-size:170px;line-height:1;direction:ltr}
.lock .date{position:absolute;top:300px;left:0;right:0;text-align:center;font-weight:700;font-size:28px;color:var(--muted)}
.notif{position:absolute;left:24px;right:24px;top:380px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.12);border-radius:30px;padding:20px 24px;opacity:0}
.notif .app{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--soft)}
.notif .app i{width:30px;height:30px;border-radius:8px;background:var(--wa);display:inline-block}
.notif .txt{font-weight:700;font-size:30px;margin-top:8px;line-height:1.4}

/* sheet */
.sheet{width:960px;background:#fbfbf8;border-radius:24px;overflow:hidden;color:#1f2a27;box-shadow:0 40px 120px rgba(0,0,0,.5)}
.sheet .top{background:#e9efe9;padding:16px 26px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:26px;color:#1d5c46}
.sheet .top i{width:34px;height:42px;background:#1fa463;border-radius:6px;display:inline-block}
.sheet table{width:100%;border-collapse:collapse;font-size:24px}
.sheet th{background:#f1f4f1;font-weight:800;color:#3d4b47;padding:12px 10px;border:1px solid #dfe5df;text-align:start}
.sheet td{font-weight:600;padding:14px 10px;border:1px solid #e6ebe6;white-space:nowrap}
.sheet tr.new td{background:#e8f8f0}

/* bars */
.bars{display:flex;flex-direction:column;gap:18px;width:100%}
.bar-row{display:grid;grid-template-columns:200px 1fr 80px;align-items:center;gap:16px;font-weight:700;font-size:28px}
.bar-track{height:30px;border-radius:999px;background:#0b1d18;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:999px;background:var(--mint);width:0}

/* price cards */
.price{border-radius:32px;padding:34px 36px;width:880px}
.price .lbl{font-weight:800;font-size:24px;letter-spacing:.5px;color:var(--muted)}
.price .name{font-weight:900;font-size:50px;margin-top:4px}
.price .amt{font-family:Serif;font-size:120px;line-height:1;direction:ltr;display:inline-block}
.price .unit{font-weight:800;font-size:34px}
.price.light{background:var(--cream);color:var(--ink);border:3px solid var(--em)}
.price.light .lbl{color:#5a6b66}
.check{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px}
.check:before{content:"";width:30px;height:30px;border-radius:50%;background:var(--em);flex:none;
}

/* cta */
.cta-btn{display:flex;align-items:center;gap:22px;background:var(--wa);color:#052e16;font-weight:900;font-size:58px;border-radius:999px;padding:26px 60px;box-shadow:0 20px 70px rgba(37,211,102,.35)}
.ring{position:absolute;border-radius:50%;border:6px solid var(--mint);pointer-events:none}

/* kanban */
.lead{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 20px;display:flex;align-items:center;gap:16px;width:100%}
.lead .nm{font-weight:800;font-size:30px;flex:1}
.lead .sc{font-family:Serif;font-size:52px;direction:ltr;width:90px;text-align:center}
.badge{font-weight:900;font-size:26px;border-radius:999px;padding:4px 18px}
.hot{background:rgba(251,113,133,.16);color:var(--red);border:2px solid rgba(251,113,133,.5)}
.warm{background:rgba(251,191,36,.14);color:var(--amber);border:2px solid rgba(251,191,36,.5)}
.cold{background:rgba(96,165,250,.14);color:var(--blue);border:2px solid rgba(96,165,250,.5)}
</style>
</head>
<body>
<div id="stage"><div id="grid"></div>
  <div class="brandmark"><span class="dot"></span><span>OT1-Pro</span><small>AI Sales Partner</small></div>
  <div id="scenes"></div>
  <div id="cap"><span></span></div>
  <div id="foot"><span style="background:var(--wa)"></span><span style="background:var(--ig)"></span><span style="background:var(--fb)"></span><b>ot1-pro.com</b></div>
</div>
<script>
/* ---------- engine core ---------- */
const $ = h => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - x, 3);
const eb = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const p = (t, a, d = .5) => cl((t - a) / d);
function pop(el, t, a, d = .45, dy = 40) { if (!el) return; const k = p(t, a, d); el.style.opacity = k; el.style.transform = `translateY(${(1 - eo(k)) * dy}px) scale(${.94 + .06 * eb(k)})`; }
function fade(el, t, a, d = .4) { if (!el) return; el.style.opacity = p(t, a, d); }
function slideX(el, t, a, d = .5, dx = 120) { if (!el) return; const k = p(t, a, d); el.style.opacity = k; el.style.transform = `translateX(${(1 - eo(k)) * dx}px)`; }
const fmt = n => Math.round(n).toLocaleString('en-US');
const q = (root, s) => root.querySelector(s);
const qa = (root, s) => [...root.querySelectorAll(s)];

/* reusable component builders */
const C = {
  phone(name, sub, bubbles, opts = {}) {
    return `<div class="phone"><div class="notch"></div>
      <div class="bar"><div class="avatar">${name.trim()[0]}</div><div class="who">${name}<small>${sub}</small></div></div>
      ${opts.example ? '<div class="example">مثال توضيحي</div>' : ''}
      <div class="msgs">${bubbles.map((b, i) => `<div class="b ${b[0]} ${b[0] === 'out' && b[2] !== false ? 'ai' : ''}" data-i="${i}">${b[1]}${b[0] === 'out' && b[2] !== false ? '<span class="meta">رد AI · ثانيتين</span>' : ''}</div>`).join('')}</div></div>`;
  },
  lock(time, date, app, txt) {
    return `<div class="lock"><div class="time">${time}</div><div class="date">${date}</div>
      <div class="notif"><div class="app"><i></i>${app}</div><div class="txt">${txt}</div></div></div>`;
  },
  sheet(title, cols, rows) {
    return `<div class="sheet"><div class="top"><i></i>${title}</div><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr class="new">${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
};

/* chat bubbles appear one by one at given local times */
function chatSeq(root, lt, times) { qa(root, '.b').forEach((b, i) => pop(b, lt, times[i] ?? 99, .35, 24)); }

/* ---------- timeline ---------- */
let SCENES = [], CAPS = [], TOTAL = 0;
function boot(def, timing) {
  // timing.lines: [{t0,t1}] per spoken line; def.scenes[i].line = index of line it starts on
  TOTAL = timing.duration;
  const host = document.getElementById('scenes');
  SCENES = def.scenes.map((s, i) => {
    const el = $(`<div class="scene">${s.html}</div>`); host.appendChild(el);
    const L = timing.lines[s.line];
    const start = s.line === 0 && !s.at ? 0 : L.t0 + (s.at || 0) * (L.t1 - L.t0) - .15;
    return { ...s, el, start, rel: i => timing.lines[i].t0 - start };
  });
  SCENES.forEach((s, i) => s.end = i + 1 < SCENES.length ? SCENES[i + 1].start : TOTAL);
  // captions: split each line into chunks of <= maxWords, timed by char share
  def.captions.forEach((txt, li) => {
    const L = timing.lines[li]; if (!L) return;
    const words = txt.split(/\s+/).map(w => /^\*.*\*[.،؟?!:…»]*$/.test(w) ? w.replace(/^\*(.*)\*([.،؟?!:…»]*)$/, '<b>$1</b>$2') : w);
    // 1) split at sentence/clause punctuation, 2) merge tiny segments, 3) split long ones evenly (<= 6 words)
    let segs = [], cur = [];
    words.forEach(w => { cur.push(w); if (/[.،؟?!:…»]$/.test(w.replace(/<[^>]+>/g, ''))) { segs.push(cur); cur = []; } });
    if (cur.length) segs.push(cur);
    const merged = [];
    segs.forEach(sg => { const last = merged[merged.length - 1]; if (last && (sg.length <= 2 || last.length <= 2) && last.length + sg.length <= 7) last.push(...sg); else merged.push([...sg]); });
    const chunks = [];
    merged.forEach(sg => { const n = Math.ceil(sg.length / 6), per = Math.ceil(sg.length / n); for (let i = 0; i < sg.length; i += per) chunks.push(sg.slice(i, i + per).join(' ')); });
    const tot = chunks.reduce((a, c) => a + c.replace(/<[^>]+>/g, '').length, 0); let t = L.t0;
    chunks.forEach(c => { const d = (L.t1 - L.t0) * c.replace(/<[^>]+>/g, '').length / tot; CAPS.push({ t0: t, t1: t + d, txt: c }); t += d; });
  });
  window.TOTAL = TOTAL;
}
const capEl = document.querySelector('#cap span');
let lastCap = null;
window.renderAt = function (T) {
  SCENES.forEach(s => {
    const vis = T >= s.start - .01 && T < s.end + .3;
    s.el.style.display = vis ? 'flex' : 'none';
    if (!vis) return;
    const lt = T - s.start;
    const fin = eo(p(lt, 0, .35)), fout = 1 - p(T, s.end, .3);
    s.el.style.opacity = Math.min(fin, fout);
    s.el.style.transform = `translateY(${(1 - fin) * 30 - (1 - fout) * 30}px)`;
    s.update && s.update(s.el, lt, s.end - s.start, s);
  });
  const c = CAPS.find(c => T >= c.t0 && T < c.t1 + .05);
  if (c !== lastCap) { capEl.innerHTML = c ? c.txt : ''; capEl.style.display = c ? 'inline-block' : 'none'; lastCap = c; }
  if (c) { const k = eo(p(T, c.t0, .18)); capEl.style.opacity = k; capEl.style.transform = `translateY(${(1 - k) * 14}px)`; }
};
</script>
<script>
const params = new URLSearchParams(location.search);
const v = params.get('v') || 'general';
document.write(`<script src="shared.js"><\/script><script src="scenes-${v}.js"><\/script>`);
</script>
<script>
fetch(`timing-${v}.json`).then(r => r.json()).then(t => { boot(window.AD, t); document.fonts.ready.then(() => { window.READY = true; renderAt(+(params.get('t') || 0)); }); });
</script>
</body>
</html>
