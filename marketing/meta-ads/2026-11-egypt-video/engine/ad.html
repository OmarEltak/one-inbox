<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>OT1-Pro ad renderer</title>
<link rel="stylesheet" href="emoji.css">
<style>
@font-face{font-family:Cairo;font-weight:600;src:url(fonts/cairo-arabic-600-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-arabic-800-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-arabic-900-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:600;src:url(fonts/cairo-latin-600-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-latin-700-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-latin-800-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-latin-900-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Poster;src:url(fonts/lalezar-arabic-400-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Poster;src:url(fonts/cairo-latin-900-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Serif;src:url(fonts/instrument-serif-latin-400-normal.woff2)format('woff2')}

:root{--yellow:#FFD60A;--ink:#0B0F0E;--paper:#FFFBF0;--em:#00B67A;--em2:#00875A;--red:#E8202A;--wa:#25D366;--sky:#2F8CFF;--amber:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Cairo,Emoji,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;opacity:0}
#bg-yellow{background:var(--yellow)}
#bg-yellow:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(0,0,0,.035) 0 22px,transparent 22px 44px)}
#bg-paper{background:var(--paper)}
#bg-paper:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(11,15,14,.09) 2px,transparent 2.5px);background-size:34px 34px}
#bg-ink{background:radial-gradient(1000px 800px at 70% 20%,#1b2a3f,transparent 60%),radial-gradient(900px 900px at 10% 90%,#2a1640,transparent 60%),var(--ink)}
#bg-em{background:radial-gradient(900px 900px at 80% 10%,#22d39a,transparent 60%),linear-gradient(160deg,#00a46d,#00875A)}

.brandmark{position:absolute;top:150px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  background:#fff;color:var(--ink);border-radius:999px;padding:6px 26px 6px 22px;font-family:Serif;font-size:44px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:5;direction:ltr}
.brandmark i{width:14px;height:14px;border-radius:50%;background:var(--em)}

.scene{position:absolute;left:0;right:0;top:270px;height:820px;display:flex;align-items:center;justify-content:center;opacity:0;
  --fg:var(--ink);--acc:var(--red);--card:#fff;--line:rgba(11,15,14,.12);--muted:#55594f;color:var(--fg)}
.scene>.cam{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.t-paper{--acc:var(--em2);--muted:#6b6b5e}
.t-ink{--fg:#fff;--acc:var(--yellow);--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--muted:#aeb8b4}
.t-em{--fg:#fff;--acc:var(--yellow);--card:rgba(255,255,255,.14);--line:rgba(255,255,255,.3);--muted:#d1fae5}

#cap{position:absolute;left:50px;right:50px;top:1110px;height:150px;display:flex;align-items:center;justify-content:center;z-index:6}
#cap span{display:inline-block;font-weight:800;font-size:52px;line-height:1.35;text-align:center;color:#fff;
  background:rgba(11,15,14,.9);border-radius:22px;padding:10px 30px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
#cap b{color:var(--yellow);font-weight:900}

.poster{font-family:Poster,Cairo;font-weight:400;line-height:1.05;text-align:center}
.h1{font-weight:900;font-size:86px;line-height:1.15;text-align:center}
.h2{font-weight:900;font-size:62px;line-height:1.2;text-align:center}
.h3{font-weight:700;font-size:38px;line-height:1.35;text-align:center;color:var(--muted)}
.acc{color:var(--acc)} .muted{color:var(--muted)} .red{color:var(--red)} .em{color:var(--em2)}
.serif{font-family:Serif} .ltr{direction:ltr;unicode-bidi:isolate}
.col{display:flex;flex-direction:column;align-items:center;gap:22px}
.row{display:flex;align-items:center;gap:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:30px;padding:28px 32px;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:10px 28px;font-weight:900;font-size:36px;background:var(--card);border:2px solid var(--line);white-space:nowrap}
.chip{display:inline-block;font-weight:900;font-size:28px;border-radius:999px;padding:4px 20px;background:var(--ink);color:var(--yellow)}
.stamp{position:absolute;font-family:Poster,Cairo;border:10px solid currentColor;border-radius:24px;padding:6px 34px;line-height:1.1;white-space:nowrap;opacity:0}

.phone{width:540px;height:790px;border-radius:62px;background:#0B0F0E;padding:12px;box-shadow:0 40px 100px rgba(0,0,0,.35);position:relative;flex:none}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#EFE7DC}
.phone .scr:before{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(0,0,0,.06) 1.5px,transparent 2px);background-size:22px 22px}
.phone .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:140px;height:32px;border-radius:20px;background:#000;z-index:5}
.phone .bar{position:relative;z-index:2;height:118px;background:#fff;display:flex;align-items:flex-end;gap:14px;padding:0 24px 14px;border-bottom:1px solid #e6e1d6}
.phone .av{width:58px;height:58px;border-radius:50%;background:#dff5ea;color:var(--em2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px}
.phone .who{font-weight:900;font-size:28px;line-height:1.1;color:#111}
.phone .who small{display:block;font-weight:700;font-size:19px;color:#667}
.phone .msgs{position:absolute;z-index:2;top:118px;bottom:0;left:0;right:0;padding:20px 18px;display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
.b{max-width:84%;font-weight:700;font-size:26px;line-height:1.45;padding:12px 18px;border-radius:22px;opacity:0;color:#111;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.b.in{align-self:flex-start;background:#fff;border-start-start-radius:6px}
.b.out{align-self:flex-end;background:#D9FDD3;border-start-end-radius:6px}
.b .meta{display:block;font-size:17px;font-weight:700;color:#7a8a80;margin-top:2px}
.b .ai{display:inline-block;background:var(--em);color:#fff;border-radius:8px;padding:0 8px;font-size:15px;margin-inline-end:6px}
.ex{position:absolute;z-index:4;top:126px;left:50%;transform:translateX(-50%);font-size:17px;font-weight:800;color:#667;background:#fff;border-radius:999px;padding:2px 14px;white-space:nowrap}

.sheet{width:960px;background:#fff;border-radius:24px;overflow:hidden;color:#1f2a27;box-shadow:0 30px 90px rgba(0,0,0,.2);border:2px solid rgba(0,0,0,.08)}
.sheet .top{background:#e9f5ee;padding:16px 26px;display:flex;align-items:center;gap:14px;font-weight:900;font-size:28px;color:#14532d}
.sheet .top i{width:34px;height:42px;background:#1fa463;border-radius:6px;display:inline-block}
.sheet table{width:100%;border-collapse:collapse;font-size:25px}
.sheet th{background:#f4f6f4;font-weight:900;color:#3d4b47;padding:12px 12px;border:1px solid #e3e8e3;text-align:start}
.sheet td{font-weight:700;padding:14px 12px;border:1px solid #edf0ed;white-space:nowrap}

.score{display:flex;align-items:center;gap:22px;background:#fff;color:#111;border-radius:28px;padding:18px 26px;width:920px;box-shadow:0 16px 40px rgba(0,0,0,.12);border:2px solid rgba(0,0,0,.06);opacity:0}
.score .ring{width:118px;height:118px;flex:none;position:relative}
.score .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Serif;font-size:52px;direction:ltr}
.score .nm{font-weight:900;font-size:32px}
.score .note{font-weight:700;font-size:26px;color:#4b5563;line-height:1.4;margin-top:2px}
.score .note b{color:var(--em2);font-weight:900}

.bar-row{display:grid;grid-template-columns:200px 1fr 100px;align-items:center;gap:16px;font-weight:900;font-size:34px}
.bar-track{height:36px;border-radius:999px;background:rgba(11,15,14,.08);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;width:0}

.price{border-radius:34px;padding:26px 36px;width:900px;background:#fff;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.price .lbl{font-weight:900;font-size:24px;letter-spacing:.5px;color:#6b7280}
.price .name{font-weight:900;font-size:52px}
.price .amt{font-family:Serif;font-size:108px;line-height:1;direction:ltr;display:inline-block}
.price .unit{font-weight:900;font-size:34px}
.check{display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px}
.check:before{content:"✓";width:38px;height:38px;border-radius:50%;background:var(--em);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}

.cta-btn{display:flex;align-items:center;gap:22px;background:var(--wa);color:#052e16;font-weight:900;font-size:58px;border-radius:999px;padding:26px 60px;box-shadow:0 22px 70px rgba(0,0,0,.25)}
.ring2{position:absolute;inset:0;border-radius:999px;border:6px solid #fff;pointer-events:none;opacity:0}

.split{display:flex;gap:16px;width:1040px;height:810px}
.side{flex:1;border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#EFE7DC;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.side .hd{height:112px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#fff;font-weight:900;font-size:34px}
.side .clk{font-family:Serif;font-size:50px;direction:ltr;background:rgba(0,0,0,.22);border-radius:16px;padding:0 14px}
.side .msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:14px;overflow:hidden}
.side .b{font-size:25px;max-width:94%;padding:10px 14px}
.side .ov{position:absolute;left:0;right:0;bottom:0;top:112px;display:flex;align-items:center;justify-content:center;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bg-yellow"></div><div class="bg" id="bg-paper"></div><div class="bg" id="bg-ink"></div><div class="bg" id="bg-em"></div>
  <div class="brandmark"><i></i>OT1-Pro</div>
  <div id="scenes"></div>
  <div id="cap"><span></span></div>
</div>
<script>
/* ---------- engine core: every frame is a pure function of time ---------- */
const $ = h => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - x, 3);
const eb = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const p = (t, a, d = .5) => cl((t - a) / d);
const q = (r, s) => r.querySelector(s), qa = (r, s) => [...r.querySelectorAll(s)];
const fmt = n => Math.round(n).toLocaleString('en-US');
function pop(el, t, a, d = .4, dy = 40) { if (!el) return; const k = p(t, a, d); el.style.opacity = k; el.style.transform = `translateY(${(1 - eo(k)) * dy}px) scale(${.9 + .1 * eb(k)})`; }
function slam(el, t, a, rot = -8) { if (!el) return; const k = p(t, a, .22); el.style.opacity = k; el.style.transform = `rotate(${rot}deg) scale(${2.2 - 1.2 * eo(k)})`; }
function slideX(el, t, a, d = .45, dx = 140) { if (!el) return; const k = p(t, a, d); el.style.opacity = k; el.style.transform = `translateX(${(1 - eo(k)) * dx}px)`; }
function fade(el, t, a, d = .4) { if (el) el.style.opacity = p(t, a, d); }
function strike(el, t, a) { if (el) el.style.transform = `scaleX(${eo(p(t, a, .3))})`; }
function words(root, t, a, step = .18) { qa(root, '[data-w]').forEach((w, i) => pop(w, t, a + i * step, .3, 30)); }
const W = (txt, cls = '') => txt.split(' ').map(w => `<span data-w class="${cls}" style="display:inline-block;opacity:0">${w}</span>`).join(' ');
/* chat bubble: takes no space until it arrives, so chats stack from the bottom like a real phone */
function bub(el, t, a) { if (!el) return; el.style.display = t < a ? 'none' : ''; pop(el, t, a, .3, 24); }
function chatSeq(root, t, times) { qa(root, '.b').forEach((b, i) => bub(b, t, times[i] ?? 99)); }

const C = {
  phone(name, sub, bubbles, ex = true) {
    return `<div class="phone"><div class="scr"><div class="notch"></div>
      <div class="bar"><div class="av">${name.trim()[0]}</div><div class="who">${name}<small>${sub}</small></div></div>
      ${ex ? '<div class="ex">مثال توضيحي</div>' : ''}
      <div class="msgs">${bubbles.map(b => C.bubble(b)).join('')}</div></div></div>`;
  },
  bubble(b) { return `<div class="b ${b[0]}">${b[0] === 'out' && b[2] !== false ? '<span class="ai">AI</span>' : ''}${b[1]}${b[3] ? `<span class="meta ltr">${b[3]}</span>` : ''}</div>`; },
  sheet(title, cols, rows) {
    return `<div class="sheet"><div class="top"><i></i>${title}</div><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
  ring(v, color) { const c = 2 * Math.PI * 50; return `<div class="ring"><svg width="118" height="118" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="#eee" stroke-width="12" fill="none"/><circle data-arc data-v="${v}" cx="60" cy="60" r="50" stroke="${color}" stroke-width="12" fill="none" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg><b data-sv="${v}">0</b></div>`; },
  scoreCard(name, v, note, color) { return `<div class="score" data-sc>${C.ring(v, color)}<div><div class="nm">${name}</div><div class="note"><b>ملاحظة AI:</b> ${note}</div></div></div>`; },
  wave(n, w, color = '#7a8a80') { return '<svg width="' + w + '" height="36" viewBox="0 0 ' + w + ' 36">' + Array.from({ length: n }, (_, i) => { const h = 5 + 12 * Math.abs(Math.sin(i * 1.7)); return `<rect x="${i * (w / n)}" y="${18 - h}" width="${w / n * .55}" rx="1.5" height="${2 * h}" fill="${color}"/>`; }).join('') + '</svg>'; },
  voice(sec, w = 170) { return `<span class="row" style="gap:10px"><b style="width:40px;height:40px;border-radius:50%;background:var(--em);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex:none">▶</b>${C.wave(24, w)}<span class="ltr" style="font-size:18px;color:#7a8a80">${sec}</span></span>`; },
};
function animScore(card, t, a) {
  pop(card, t, a, .35, 40);
  const arc = q(card, '[data-arc]'), v = +arc.dataset.v, c = 2 * Math.PI * 50, k = eo(p(t, a + .15, .9));
  arc.setAttribute('stroke-dashoffset', c * (1 - v / 100 * k)); q(card, '[data-sv]').textContent = Math.round(v * k);
}

let SCENES = [], CAPS = [], TOTAL = 0;
window.SFX = [];
function boot(def, timing) {
  TOTAL = timing.duration;
  const host = document.getElementById('scenes');
  SCENES = def.scenes.map(s => {
    const el = $(`<div class="scene t-${s.bg || 'paper'}"><div class="cam">${s.html}</div></div>`); host.appendChild(el);
    const L = timing.lines[s.line];
    const start = s.line === 0 && !s.at ? 0 : L.t0 + (s.at || 0) * (L.t1 - L.t0) - .12;
    return { ...s, el, cam: el.firstElementChild, start, rel: i => timing.lines[i].t0 - start, relEnd: i => timing.lines[i].t1 - start };
  });
  SCENES.forEach((s, i) => { s.end = i + 1 < SCENES.length ? SCENES[i + 1].start : TOTAL; s.d = s.end - s.start; });
  SCENES.forEach((s, i) => {
    if (i > 0 && !s.noWhoosh) SFX.push([s.start - .1, 'whoosh']);
    (s.sfx ? s.sfx(s.d, s) : []).forEach(([t, n]) => SFX.push([+(s.start + t).toFixed(3), n]));
  });
  def.captions.forEach((txt, li) => {
    const L = timing.lines[li]; if (!L) return;
    const words = txt.split(/\s+/).map(w => /^\*.*\*[.،؟?!:…»]*$/.test(w) ? w.replace(/^\*(.*)\*([.،؟?!:…»]*)$/, '<b>$1</b>$2') : w);
    let segs = [], cur = [];
    words.forEach(w => { cur.push(w); if (/[.،؟?!:…»]$/.test(w.replace(/<[^>]+>/g, ''))) { segs.push(cur); cur = []; } });
    if (cur.length) segs.push(cur);
    const merged = [];
    segs.forEach(sg => { const last = merged[merged.length - 1]; if (last && (sg.length <= 2 || last.length <= 2) && last.length + sg.length <= 7) last.push(...sg); else merged.push([...sg]); });
    const chunks = [];
    merged.forEach(sg => { const n = Math.ceil(sg.length / 6), per = Math.ceil(sg.length / n); for (let i = 0; i < sg.length; i += per) chunks.push(sg.slice(i, i + per).join(' ')); });
    const len = c => c.replace(/<[^>]+>/g, '').length, tot = chunks.reduce((a, c) => a + len(c), 0); let t = L.t0;
    chunks.forEach(c => { const d = (L.t1 - L.t0) * len(c) / tot; CAPS.push({ t0: t, t1: t + d, txt: c }); t += d; });
  });
  window.TOTAL = TOTAL;
}
const capEl = document.querySelector('#cap span');
let lastCap = null;
window.renderAt = function (T) {
  const w = { yellow: 0, paper: 0, ink: 0, em: 0 };
  SCENES.forEach(s => {
    const vis = T >= s.start - .01 && T < s.end + .25;
    s.el.style.display = vis ? 'flex' : 'none';
    if (!vis) return;
    const lt = T - s.start;
    const fin = eo(p(lt, 0, .3)), fout = 1 - p(T, s.end, .25), k = Math.min(fin, fout);
    s.el.style.opacity = k;
    w[s.bg || 'paper'] = Math.max(w[s.bg || 'paper'], k);
    s.el.style.transform = `scale(${1.06 - .06 * fin + .04 * (1 - fout)})`;
    s.cam.style.transform = `scale(${1 + .035 * cl(lt / Math.max(s.d, 1))})`;
    s.update && s.update(s.el, lt, s.d, s);
  });
  const tot = Object.values(w).reduce((a, b) => a + b, 0) || 1;
  for (const k in w) document.getElementById('bg-' + k).style.opacity = w[k] / tot;
  const c = CAPS.find(c => T >= c.t0 && T < c.t1 + .05);
  if (c !== lastCap) { capEl.innerHTML = c ? c.txt : ''; capEl.style.display = c ? 'inline-block' : 'none'; lastCap = c; }
  if (c) { const k = eo(p(T, c.t0, .16)); capEl.style.opacity = k; capEl.style.transform = `translateY(${(1 - k) * 14}px)`; }
};
</script>
<script>
const params = new URLSearchParams(location.search);
const v = params.get('v') || 'general';
document.write(`<script src="shared.js"><\/script><script src="scenes-${v}.js"><\/script>`);
</script>
<script>
fetch(`timing-${params.get('tm') || v}.json`).then(r => r.json()).then(t => { boot(window.AD, t); document.fonts.ready.then(() => { window.READY = true; renderAt(+(params.get('t') || 0)); }); });
</script>
</body>
</html>
