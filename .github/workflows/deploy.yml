name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/ot1-pro.com
            git pull origin main

            # ── Prod .env guards (idempotent — only writes if not already set) ──
            sed -i 's/^APP_DEBUG=true/APP_DEBUG=false/' .env
            grep -q '^FLARE_KEY=' .env    || echo 'FLARE_KEY=${{ secrets.FLARE_KEY }}'    >> .env
            grep -q '^FLARE_LOG=' .env    || echo 'FLARE_LOG=true'                         >> .env
            grep -q '^LOG_STACK=.*flare'  .env || sed -i 's/^LOG_STACK=.*/LOG_STACK=single,flare/' .env

            composer install --no-dev --optimize-autoloader
            npm ci && npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            sudo systemctl reload php8.4-fpm
            # storage/logs is written to by php-fpm (www-data) between commands,
            # so any new files land with www-data ownership. Use sudo on chmod/touch
            # so we can normalize permissions regardless of who created each file.
            sudo chown -R deploy:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            sudo touch storage/logs/laravel.log
            sudo chmod 664 storage/logs/laravel.log
